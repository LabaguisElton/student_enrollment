{% extends "base.html" %}

{% block title %}Courses{% endblock %}

{% block content %}
	<h1>Courses</h1>
	{% if courses %}
		<ul>
			{% for course in courses %}
				<li>
					{{ course.name }} - {{ course.instructor }} ({{ course.duration }} weeks)
				</li>
			{% endfor %}
		</ul>
	{% else %}
		<p>No courses found.</p>
	{% endif %}
{% endblock %}
